# Blueprint для Render: https://render.com/docs/blueprint-spec
# Секреты (sync: false) Render попросит ввести при создании сервиса.
services:
  - type: worker
    name: numerita-zavod
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m zavod
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Claude API
      - key: ANTHROPIC_API_KEY
        sync: false
      # Threads API — можно оставить пустыми до подключения
      - key: THREADS_USER_ID
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      # Настройки
      - key: TIMEZONE
        value: Europe/Moscow
      - key: TTS_VOICE
        value: ru-RU-SvetlanaNeural
      - key: TTS_RATE
        value: "+100%"
      - key: TTS_AUTO
        value: "1"
      - key: DB_PATH
        value: /var/data/zavod.db
